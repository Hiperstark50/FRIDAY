name: Build FRIDAY APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project files
        run: |
          echo "=== ROOT ==="
          pwd
          ls -la
          echo "=== GRADLE FILES ==="
          find . -name "gradlew" -o -name "settings.gradle.kts" -o -name "build.gradle.kts"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
